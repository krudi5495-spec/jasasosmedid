<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - JasaSosmedID</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Admin Panel - Kelola Saldo Pengguna</h1>
        
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Username / ID Pengguna</label>
            <input type="text" id="username" placeholder="Contoh: budi123" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Jumlah Saldo (Rp)</label>
            <input type="number" id="balance" placeholder="Contoh: 50000" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button onclick="saveBalance()" class="w-full bg-blue-600 text-white p-2 rounded font-semibold hover:bg-blue-700 transition">Simpan / Update Saldo</button>
        
        <p id="statusMsg" class="mt-4 text-center text-green-600 font-medium"></p>
        
        <div class="mt-6 border-t pt-4">
            <a href="index.html" class="text-blue-500 hover:underline">&larr; Kembali ke Website Utama</a>
        </div>
    </div>

    <script>
        function saveBalance() {
            const username = document.getElementById('username').value.trim();
            const inputBalance = parseInt(document.getElementById('balance').value) || 0;

            if (!username || inputBalance <= 0) {
                alert('Mohon masukkan username dan jumlah saldo yang valid!');
                return;
            }

            // Ambil saldo lama jika akun tersebut sudah pernah memiliki saldo, lalu tambahkan
            const key = 'user_' + username;
            const existingBalance = parseInt(localStorage.getItem(key)) || 0;
            const totalBalance = existingBalance + inputBalance;

            // Simpan saldo terbaru ke LocalStorage
            localStorage.setItem(key, totalBalance);
            localStorage.setItem('last_user', username);

            document.getElementById('statusMsg').innerText = `Sukses! Saldo untuk akun "${username}" berhasil ditambah. Total saldo: Rp ${totalBalance.toLocaleString('id-ID')}`;
            
            // Kosongkan form input
            document.getElementById('username').value = '';
            document.getElementById('balance').value = '';
        }
    </script>
</body>
</html>
